[control_center.calendar]
show_events_card = true
show_week_numbers = false # ISO 8601 week numbers in the month grid

[dock]
enabled = false

[keybinds]
cancel = ["escape"]
delete = ["del"]
down = ["down"]
left = ["left"]
right = ["right"]
tab_next = ["tab"]
tab_previous = ["shift+iso_left_tab"]
up = ["up"]
validate = ["kp_enter", "return", "space"]

[location]
auto_locate = true

[lockscreen]
blur_intensity = 0.5
blurred_desktop = false
enabled = true
tint_intensity = 0.3

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = ["clock", "date", "lockscreen-login-box@HDMI-A-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget.clock]
box_height = 128.0
box_width = 240.0
cx = 1280.0
cy = 272.0
output = "HDMI-A-1"
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.clock.settings]
background_opacity = 0.88
center_text = true
clock_style = "digital"
font_family = "JetBrainsMono NF"

[lockscreen_widgets.widget.date]
box_height = 48.0
box_width = 336.0
cx = 1280.0
cy = 376.0
output = "HDMI-A-1"
rotation = 0.0
type = "clock"

[lockscreen_widgets.widget.date.settings]
background_opacity = 0.88
font_family = "JetBrainsMono NF"
format = "{:%A %d %B}"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.75
background_radius = 16.0
input_opacity = 0.9
input_radius = 8.0
layout = "regular"
show_media = false
show_session_buttons = true
show_unlock_hint = true
show_weather = false

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 70.0
box_width = 400.0
cx = 1280.0
cy = 1331.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "compact"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = false
show_session_buttons = true
show_unlock_hint = true
show_weather = false

[nightlight]
enabled = false
force = false
temperature_day = 6500 # Kelvin
temperature_night = 4000 # Kelvin

[notification]
background_opacity = 0.97
enable_daemon = true
layer = "top" # top | overlay
offset_x = 20 # absolute horizontal margin from the screen edge
offset_y = 8 # absolute vertical margin from the screen edge
scale = 1.0 # notification size multiplier applied on top of accessibility.ui_scale
show_actions = true # show action buttons; when false, clicking a toast triggers its default action
show_app_name = true

[osd]
background_opacity = 0.97 # background opacity of OSD popups
offset_x = 20 # absolute horizontal margin from the screen edge
offset_y = 8 # absolute vertical margin from the screen edge
orientation = "horizontal" # horizontal | vertical (volume/brightness sliders only; text popups stay horizontal)
position = "bottom_center" # top_right | top_left | top_center | bottom_right | bottom_left | bottom_center | center_right | center_left
position_vertical = "bottom_center" # same options; used when orientation = "vertical"
scale = 1.0 # OSD size multiplier applied on top of accessibility.ui_scale

[osd.kinds]
bluetooth = true # Bluetooth toggle
brightness = true # display brightness changes
caffeine = true # idle inhibitor (caffeine) toggle
dnd = true # Do Not Disturb toggle
keyboard_layout = true # input keyboard layout changes
lock_keys = true # Caps/Num/Scroll Lock changes; disable to stop polling when no widget uses them
nightlight = true # night light toggle
power_profile = true # power profile changes
privacy = true # microphone/camera/screen-share capture changes
volume = true # master volume OSD toggle
volume_input = true # input (microphone) volume; requires volume = true
volume_output = true # output (speaker) volume; requires volume = true
wifi = true # Wi-Fi toggle

[plugins]
auto_update = "all" # "all" | "official" | "none"; background git updates on startup and every 6 hours
enabled = ["davemhammer/tailscale", "noctalia/translator", "oldirtty/color_picker"]

[shell]
clipboard_auto_paste = "auto" # off | auto | ctrl_v | ctrl_shift_v | shift_insert
# settings_window_translucent = false  # translucent settings window background
# show_location = true         # hide weather location text in shell UI when false
# app_icon_color = "on_surface" # ColorSpec role or #hex when colorize is enabled
clipboard_enabled = true # false disables clipboard panel, history, and compositor clipboard hooks
clipboard_history_max_entries = 100 # unpinned history cap (10–10000); pinned entries are extra
clipboard_image_action_command = "" # image preview action: gimp {path}, or satty -f - via stdin
# A Wayland selection is served by the app that owns it, so it dies when that app exits.
# With this on, the shell claims it back so the item stays pasteable. Caveat: a password
# manager that clears the clipboard by exiting looks identical to any other app closing,
# so its secret can be kept alive too. Apps advertising x-kde-passwordManagerHint are
# already excluded; set this to false if you rely on one that does not.
clipboard_keep_from_closed_apps = true # keep the last copied item pasteable after the app you copied it from closes
corner_radius_scale = 1.0 # 0 = square, 1 = default, 2 = extra rounded
date_format = "%A, %x" # default shell UI date format
font_family = "JetBrainMono NF"
niri_overview_type_to_launch_enabled = false # opt in to type-to-launch from niri overview
offline_mode = false # block all outgoing HTTP when true
password_style = "random" # default | random
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true # show advanced settings by default in Settings
shared_gl_context = true # startup-only; false isolates GPU contexts for broken drivaers
# panel_anchor_bar   = "main"        # bar panels attach to without a source bar; omit = first enabled bar
telemetry_enabled = false # send an anonymous startup ping
time_format = "{:%H:%M}" # default shell UI time format

[shell.animation]
enabled = true
speed = 1.0 # 0.5 = 2× slower, 2.0 = 2× faster

[shell.keyboard_layout.custom_labels] # override display labels by exact layout name
"English (US)" = "EN"

[shell.launcher]
app_grid = false # show app icon grid view when results are apps only
auto_paste = "auto" # off | auto | ctrl_v | ctrl_shift_v | shift_insert (copy activations)
categories = true # show category filters in the launcher
compact = false # use smaller icons and tighter result rows
fetch_exchange_rates = true # refresh currency rates from third-party sources
pinned = [] # e.g. ["firefox", "code", "kitty"] (launcher only)
provider_prefix = "/" # common prefix character for provider trigger words (e.g. "/" or ".")
show_app_origin_indicator = true # show package origin indicators on application results
show_icons = true # show application icons in launcher results
sort_by_usage = true # sort apps by usage frequency

# For each provider: prefix = trigger word (empty falls back to its built-in default; triggers on
# provider_prefix + trigger, e.g. "/emo"). global = true also surfaces it in unprefixed search.
[shell.launcher.providers.calculator]
global = true # also show calculator results in unprefixed search
prefix = "calc"

[shell.launcher.providers.emoji]
prefix = "emo"

[shell.launcher.providers.session]
global = false # set true to include session actions in unprefixed search
prefix = "session"

[shell.launcher.providers.wallpaper]
prefix = "wall"

[shell.launcher.providers.windows]
prefix = "win"

[shell.mpris]
blacklist = [] # ignore MPRIS players by bus/identity/desktop entry token

[shell.panel]
borders = true # panel shell outline and in-panel section cards
clipboard_placement = "attached" # attached | floating
clipboard_position = "center" # auto | center | top_left | … (floating only)
control_center_placement = "attached" # attached | floating
launcher_placement = "attached" # attached | floating
launcher_position = "center" # auto | center | top_left | … (floating only)
open_near_click_clipboard = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_control_center = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_launcher = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_session = false # for attached/floating placement, follow the bar click instead of bar-center
open_near_click_wallpaper = false # for attached/floating placement, follow the bar click instead of bar-center
session_placement = "attached" # attached | floating
shadow = true # cast the global [shell.shadow] from panel surfaces
transparency_mode = "solid" # solid | soft | glass; controls floating-panel opacity and card translucency
wallpaper_placement = "attached" # attached | floating

[shell.privacy]
cam_filter_regex = "" # camera app names to ignore in privacy indicators and OSD
mic_filter_regex = "" # microphone app names to ignore in privacy indicators and OSD
screen_filter_regex = "" # screen-sharing app names to ignore in privacy indicators and OSD

[shell.screenshot]
confirm_region = false # confirm region captures with Enter or Space
copy_to_clipboard = true # also place the PNG on the clipboard
directory = "~/Pictures/Screenshots" # output folder; empty = ~/Pictures
filename_pattern = "screenshot_%Y%m%d_%H%M%S" # empty = screenshot_%Y%m%d_%H%M%S
freeze_screen = true # freeze the desktop before region selection
pipe_command = "" # annotator/uploader, e.g. "swappy -f -" or "satty -f -"
pipe_to_command = false # pipe the PNG to a shell command on stdin
remember_last_region = true # pre-select the last region (also after cancel)
save_to_file = true # write captures as PNG to the output directory
show_cursor = false # include the mouse pointer in captures

[shell.shadow]
alpha = 0.55 # multiplied by each component's background opacity
direction = "down" # center, up, down, left, right, up_left, up_right, down_left, down_right

[system.monitor]
cpu_freq_activity_threshold = 2.5 # GHz; value tint starts when CPU clock crosses this
cpu_freq_critical_threshold = 4.5 # GHz; full highlight at/above this
cpu_poll_seconds = 2.0 # CPU usage, CPU temperature, and load average
disk_poll_seconds = 10.0 # disk usage and swap usage; graph widgets use the fastest poll above
enabled = true # sample CPU, memory, network, load, temperature, GPU VRAM, and disk statistics
gpu_poll_seconds = 5.0 # GPU temperature and VRAM usage
memory_poll_seconds = 2.0 # RAM usage
network_poll_seconds = 3.0 # network throughput

[theme]
mode = "dark" # dark | light | auto
# m3-rainbow | m3-monochrome | vibrant | faithful |
# dysfunctional | muted
pure_black_dark = false # anchor dark surfaces to true black (OLED); applies to
source = "wallpaper" # builtin | wallpaper | community
# builtin = "Noctalia"                # Ayu | Catppuccin | Dracula | Eldritch | Gruvbox |
# Kanagawa | Noctalia | Nord | Rosé Pine | Tokyo-Night
# community_palette = "Noctalia"    # fetched from api.noctalia.dev, cached locally
wallpaper_scheme = "m3-tonal-spot" # m3-tonal-spot | m3-content | m3-fruit-salad |

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "hyprland", "kitty", "qt", "starship"]
community_ids = ["bat", "fastfetch", "steam", "zen-browser"] # fetched from api.noctalia.dev/templates, cached locally
enable_builtin_templates = true
enable_community_templates = true

[theme.templates.user.zed]
input_path = "$XDG_CONFIG_HOME/home-manager/modules/noctalia/templates/zed.json"
output_path = "$XDG_CONFIG_HOME/zed/themes/noctalia.json"

[wallpaper]
directory = "~/Pictures/Wallpapers"
edge_smoothness = 0.3
enabled = true
fill_mode = "crop" # center | crop | fit | stretch | repeat | span
transition = ["disc"]
transition_duration = 1500 # milliseconds
transition_on_startup = false # animate the first wallpaper at shell startup (v4-style)

[wallpaper.automation]
enabled = false

[wallpaper.default]
path = "" # optional initial/default wallpaper path

[weather]
effects = true # visual weather effects
enabled = true
refresh_minutes = 30
unit = "celsius" # celsius | fahrenheit

# ---- Left ----
[widget.active_window]
display = "icon_and_text"
icon_size = 14
max_length = 360
min_length = 80
show_empty_label = true
title_scroll = "on_hover"

[widget.battery]
device = "auto"
display_mode = "graphic"
show_label = false
type = "battery"

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.clock]
font_weight = 600
format = "{:%H:%M} • {:%d/%m}"
interactive = true # pass clicks/scrolls through to the bar and disable hover/tooltips
scale = 1.0 # multiplies the bar scale for this widget only
tooltip_format = "{:%A, %B %d, %Y}"
vertical_format = "{:%H\n%M}"

# ---- Center ----
[widget.cpu]
label_show_units = false
stat = "cpu_usage"
type = "sysmon"

[widget."davemhammer/tailscale:status"]
notify_on_peer_change = true
refresh_interval = 10
show_counts = false

[widget.gap32]
length = 32
type = "spacer"

[widget.gap64]
length = 64
type = "spacer"

[widget.keyboard_layout]
display = "short" # "short" (e.g. "DE") or "full" (full layout name)
hide_when_single_layout = false # hide the widget when only one layout is configured
show_glyph = true
show_label = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget."oldirtty/color_picker"]
notify_on_peer_change = true
refresh_interval = 10
show_counts = false
[widget.power_profile]

[widget.power_profile.actions]
scroll_down = "none"
scroll_up = "none" # leave the wheel alone

# ---- Right ----
[widget.privacy]
hide_inactive = true
icon_spacing = 6
type = "privacy"

[widget.ram]
label_show_units = false
stat = "ram_pct"
type = "sysmon"

[widget.screenshot]
glyph = "screenshot"

[widget.temp]
label_show_units = false
stat = "cpu_temp"
type = "sysmon"

[widget.workspaces]
active_pill_size = 2.2
change_color_on_hover = true # false = keep configured workspace colors while hovering
empty_color = "surface_variant"
focused_color = "primary"
focused_output_only = false # true = only the focused monitor highlights its active workspace
hide_when_empty = false
inactive_pill_size = 1.0
label_source = "id" # id | name
labels_only_when_occupied = false # (1) (2*) ( ) (4) - occupied tags and the active tag show labels (*active but empty)
max_label_chars = 2 # truncate long workspace names (e.g. "VESKTOP" → "VE")
occupied_color = "secondary"
pill_scale = 1.0
show_all_outputs = false # true = include workspaces from every monitor; this bar's monitor comes first
show_labels = true # false = unlabeled pills (Focus Hint: app icon only)
style = "regular" # regular | minimal | focus_hint
urgent_color = "error"
