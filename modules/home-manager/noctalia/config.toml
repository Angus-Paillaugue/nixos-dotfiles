[accessibility]
high_contrast = false
ui_scale = 1.0

[audio]
enable_overdrive = false # allow volume above 100% (up to 150%)
enable_sounds = false # master toggle for UI feedback sounds
notification_sound = "" # empty = bundled sounds/notification.wav
sound_volume = 0.5 # 0.0 - 1.0
volume_change_sound = "" # empty = bundled sounds/volume-change.wav

[backdrop]
blur_intensity = 0.5 # 0.0 = no blur, 1.0 = maximum
enabled = false
tint_intensity = 0.3 # 0.0 = no tint, 1.0 = opaque

[bar.main]
auto_hide = false
background_opacity = 1.0
capsule = false
center = ["battery", "clock", "cpu", "gap32", "gap32", "gap64", "gap64", "oldirtty/color_picker:widget", "power_profile", "ram", "screenshot", "temp", "workspaces"]
concave_edge_corners = true
end = ["bluetooth", "davemhammer/tailscale:status", "gap32", "keyboard_layout", "network", "notifications", "privacy", "tray"]
margin_edge = 0
margin_ends = 0
padding = 14
position = "top" # top | bottom | left | right
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
reserve_space = true
scale = 1.0
shadow = false
start = ["active_window"]
thickness = 38
widget_spacing = 12

# Commands for the bar margin outside widget sections (dead zone):
[bar.main.dead_zone.actions]
left = "panel-toggle control-center"
scroll_down = "panel-toggle control-center"
scroll_up = "panel-toggle control-center"

[brightness]
enable_ddcutil = false

[calendar]
