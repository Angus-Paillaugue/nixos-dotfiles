# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  HOST:
    sh: hostname
  CORES:
    sh: |
      threads=$(nproc)
      ram_gb=$(awk '/MemTotal/ { printf "%d", $2 / 1024 / 1024 }' /proc/meminfo)
      ram_limit=$((ram_gb / 2))
      cpu_limit=$((threads * 9 / 10))
      cores=$((ram_limit < cpu_limit ? ram_limit : cpu_limit))
      cores=$((cores < 2 ? 2 : cores))
      echo "$cores"
  MAX_JOBS:
    sh: |
      ram_gb=$(awk '/MemTotal/ { printf "%d", $2 / 1024 / 1024 }' /proc/meminfo)
      if (( ram_gb >= 64 )); then
        echo 3
      elif (( ram_gb >= 32 )); then
        echo 2
      else
        echo 1
      fi


tasks:
  switch:
    desc: Rebuilds the NixOS system config
    summary: Rebuild a system configuration for the current system
    # This task is also called by the non-interactive user systemd service.
    # The sudo rule for this command is declared in the NixOS configuration.
    cmd: /run/wrappers/bin/sudo -n /run/current-system/sw/bin/nixos-rebuild switch --flake .#{{.HOST}} --max-jobs {{.MAX_JOBS}} --cores {{.CORES}}

  update:
    desc: Update this system
    summary: Update all pinned inputs in flake, rebuild system current and current user home
    cmds:
      - nix flake update
      - task: switch

  hardware:
    cmd: sudo nixos-generate-config --dir ./hosts/{{.HOST}}

  clean:
    cmds:
      - task: clean-garbage
      - task: clean-store

  clean-garbage:
    desc: Clean up all nixos previous generations gaarbage
    cmd: sudo nix-collect-garbage -d

  clean-store:
    cmd: sudo nix-store --optimise
