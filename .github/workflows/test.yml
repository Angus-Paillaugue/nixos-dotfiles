# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json

name: "Flake tests"

on:
  pull_request:
  push:
 
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITEA_TOKEN }}

      - run: nix flake check
